<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金錢分配任務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e8dfc8;
    --paper-dark:#ddd2b4;
    --ink:#2b2620;
    --ink-soft:#6b6252;
    --line:#b9ab80;
    --gold:#a97f2e;
    --gold-deep:#8a6620;
    --clay:#8c4536;
    --clay-deep:#6f3428;
    --cash:#3f6b52;
    --cash-deep:#2d4d3a;
    --desk:#181410;
    --desk-vein:#211b15;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, #241d16 0%, transparent 55%),
      repeating-linear-gradient(115deg, var(--desk) 0px, var(--desk) 2px, var(--desk-vein) 2px, var(--desk-vein) 4px);
    font-family:'Source Serif 4', Georgia, serif;
    color:var(--ink);
    display:flex; align-items:flex-start; justify-content:center;
    padding:28px 16px 60px;
  }
  #app{ width:100%; max-width:480px; }

  .sheet{
    background:var(--paper);
    background-image: linear-gradient(var(--paper-dark) 1px, transparent 1px);
    background-size: 100% 34px;
    background-position: 0 78px;
    border:1px solid #9a8c62;
    box-shadow: 0 1px 0 #fff5, 0 18px 34px -14px rgba(0,0,0,.65), 0 2px 0 rgba(0,0,0,.15);
    padding:26px 24px 28px;
    position:relative;
    transform:rotate(-0.4deg);
  }
  .sheet::before{ content:""; position:absolute; inset:8px; border:1px solid #9a8c6288; pointer-events:none; }

  .doc-head{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:16px;
    font-family:'Courier Prime', monospace;
  }
  .doc-code{ font-size:11px; letter-spacing:.04em; color:var(--ink-soft); }
  .doc-title{
    font-family:'Courier Prime', monospace; font-weight:700;
    font-size:clamp(22px,7vw,28px); letter-spacing:.01em; margin:0 0 4px;
  }
  .doc-sub{ font-size:14px; color:var(--ink-soft); line-height:1.7; margin:0 0 18px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-family:'Courier Prime',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=number]{
    width:100%; font-family:'Courier Prime',monospace; font-size:16px;
    background:transparent; border:none; border-bottom:1.5px dashed var(--line);
    padding:4px 2px 8px; color:var(--ink); outline:none; letter-spacing:.05em;
  }
  .field input:focus{ border-bottom-color:var(--gold-deep); }
  .field textarea{ font-family:'Source Serif 4',serif; }
  .field select{
    width:100%; font-family:'Courier Prime',monospace; font-size:15px;
    background:transparent; border:none; border-bottom:1.5px dashed var(--line);
    padding:6px 2px 8px; color:var(--ink); outline:none;
  }

  .rule-box{
    border:1px solid var(--line); padding:14px 16px; font-size:13.5px;
    line-height:1.8; color:#4a4335; margin-bottom:20px; background:#f1e9d1a0;
  }
  .rule-box b{ color:var(--ink); }
  .warn-box{
    border:1px dashed var(--clay-deep); padding:10px 14px; font-size:12px;
    line-height:1.7; color:var(--clay-deep); margin-top:16px; background:#f1e9d180;
  }
  .fixed-total{
    font-family:'Courier Prime',monospace; font-size:14px; color:var(--ink-soft);
    border:1px solid var(--line); padding:10px 14px; margin-bottom:18px; background:#f1e9d160;
  }
  .fixed-total b{ color:var(--ink); font-size:16px; }

  button{
    font-family:'Courier Prime', monospace; font-size:15px; cursor:pointer;
    border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
    padding:12px 20px; width:100%; letter-spacing:.02em;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{ transform:scale(.98); }
  button:disabled{ opacity:.4; cursor:default; }
  button.ghost{ background:transparent; color:var(--ink); border-color:var(--ink-soft); }
  .btn-row{ display:flex; gap:10px; margin-top:8px; }
  .btn-row button{ flex:1; }
  .stack{ margin-top:12px; }

  .center{ text-align:center; }

  .token-choices{ display:flex; gap:12px; margin-bottom:18px; }
  .token-card{
    flex:1; border:1.5px solid var(--line); padding:14px 10px; text-align:center;
    cursor:pointer; font-family:'Courier Prime',monospace; font-size:13px;
    background:#f1e9d160;
  }
  .token-card .glyph{ font-size:22px; display:block; margin-bottom:6px; }
  .token-card.active{ border-color:var(--ink); background:var(--paper-dark); box-shadow: inset 0 0 0 1px var(--ink); }
  .token-card.money.active{ border-color:var(--cash-deep); box-shadow: inset 0 0 0 1px var(--cash-deep); color:var(--cash-deep); }
  .token-card.chip.active{ border-color:var(--gold-deep); box-shadow: inset 0 0 0 1px var(--gold-deep); color:var(--gold-deep); }

  .ribbon{
    display:inline-block; font-family:'Courier Prime',monospace; font-size:11px;
    padding:4px 10px; border:1px solid; letter-spacing:.04em; margin-bottom:14px;
  }
  .ribbon.chip{ color:var(--gold-deep); border-color:var(--gold-deep); background:#f1e2b640; }
  .ribbon.money{ color:var(--cash-deep); border-color:var(--cash-deep); background:#dceadf60; }

  .code-display{
    font-family:'Courier Prime',monospace; font-size:34px; font-weight:700;
    letter-spacing:.14em; text-align:center; padding:18px 10px; margin:6px 0 18px;
    border:1.5px dashed var(--line); color:var(--ink);
  }
  .status-line{
    font-family:'Courier Prime',monospace; font-size:13px; text-align:center;
    color:var(--ink-soft); margin-bottom:16px;
  }

  .seal-wrap{ display:flex; justify-content:center; margin:6px 0 20px; }
  .seal{
    width:152px; height:152px; border-radius:50%; position:relative;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 4.5px var(--ink), 0 0 0 8px var(--paper), 0 0 0 9px #9a8c6288;
  }
  .seal-inner{
    width:96px; height:96px; border-radius:50%; background:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Courier Prime',monospace;
  }
  .seal-inner .n{ font-size:18px; font-weight:700; }
  .seal-inner .l{ font-size:10px; color:var(--ink-soft); letter-spacing:.05em; }

  .banknote-wrap{ display:flex; justify-content:center; margin:6px 0 20px; }
  .banknote{
    width:230px; height:120px; position:relative; border-radius:6px;
    border:2px solid var(--cash-deep);
    box-shadow: 0 4px 12px rgba(0,0,0,.4), inset 0 0 0 4px rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; font-family:'Courier Prime',monospace; overflow:hidden;
  }
  .banknote::before{
    content:''; position:absolute; inset:0; z-index:0;
    background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 2px, transparent 2px 7px);
  }
  .banknote .watermark{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:74px; font-family:'Source Serif 4',serif; font-weight:700; opacity:.16; z-index:0;
  }
  .banknote .corner{ font-size:12px; font-weight:700; z-index:1; }
  .banknote .center-amt{ font-size:26px; font-weight:700; text-align:center; z-index:1; }
  .banknote .denom{ font-size:10px; font-weight:400; margin-top:2px; letter-spacing:.05em; }
  .banknote.thousand{ background: linear-gradient(135deg, #d7e4f2 0%, #a9c6e3 45%, #d7e4f2 100%); border-color:#1f4e79; }
  .banknote.thousand .corner, .banknote.thousand .center-amt, .banknote.thousand .denom, .banknote.thousand .watermark{ color:#1f4e79; }
  .banknote.hundred{ background: linear-gradient(135deg, #f3d9d9 0%, #e2a8a8 45%, #f3d9d9 100%); border-color:#8a2f2f; }
  .banknote.hundred .corner, .banknote.hundred .center-amt, .banknote.hundred .denom, .banknote.hundred .watermark{ color:#8a2f2f; }

  .coin-zone{ border:1px dashed var(--line); padding:8px 10px 10px; margin-bottom:10px; background:#f1e9d140; }
  .coin-zone.pool{ border-style:solid; background:#f1e9d180; }
  .zone-label{ font-family:'Courier Prime',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:6px; display:flex; justify-content:space-between; }
  .coin-row{ display:flex; flex-wrap:wrap; gap:6px; min-height:36px; }
  .coin{
    width:34px; height:34px; border-radius:50%; flex:0 0 34px;
    background:radial-gradient(circle at 35% 30%, #e8c66a 0%, var(--gold) 55%, var(--gold-deep) 100%);
    border:2px solid var(--gold-deep); box-shadow:0 1px 2px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier Prime',monospace; font-weight:700; font-size:13px; color:#5a4310; padding:0; cursor:pointer;
  }
  .coin.ghost{ background:transparent; box-shadow:none; border-style:dashed; color:transparent; cursor:default; }
  .coin.dim{ background:#d9d0b6; border-color:#a99f82; color:#7a7360; box-shadow:none; cursor:default; }
  .coin.static{ cursor:default; }
  .busy-overlay{
    position:fixed; inset:0; z-index:80; background:rgba(24,20,16,.72);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    color:var(--paper); font-family:'Courier Prime',monospace; text-align:center; padding:24px; line-height:1.8;
  }
  .busy-overlay .spinner{ border-color:#6b6252; border-top-color:var(--paper); }
  .legend{ display:flex; justify-content:center; gap:22px; font-size:12.5px; font-family:'Courier Prime',monospace; margin-bottom:18px;}
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }

  .timer-badge{
    text-align:center; font-family:'Courier Prime',monospace; font-size:14px;
    color:var(--clay-deep); border:1px dashed var(--clay-deep); padding:6px 10px;
    margin-bottom:16px; background:#f1e9d160;
  }
  .timer-badge b{ font-size:18px; }

  .slider-wrap{ margin:10px 0 6px; }
  input[type=range]{
    -webkit-appearance:none; width:100%; height:6px; background:var(--line);
    border-radius:3px; outline:none; margin:10px 0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
    background:var(--gold); border:2px solid var(--ink); cursor:pointer;
    box-shadow:0 2px 3px rgba(0,0,0,.35);
  }
  input[type=range]::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%; background:var(--gold); border:2px solid var(--ink); cursor:pointer;
  }
  .split-readout{ display:flex; justify-content:space-between; font-family:'Courier Prime',monospace; font-size:13px; margin-bottom:4px; }
  .split-readout b{ font-size:17px; }

  .shield{ min-height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; }
  .shield p{ color:var(--ink-soft); font-size:13.5px; line-height:1.7; max-width:280px; }
  .spinner{ width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--ink); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .stamp-overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(24,20,16,.35); z-index:50; pointer-events:none;
  }
  .stamp-mark{
    width:150px; height:150px; border-radius:50%; border:5px solid var(--clay); color:var(--clay);
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier Prime',monospace; font-weight:700; font-size:18px; letter-spacing:.05em;
    transform:scale(2.6) rotate(-18deg); opacity:0;
    animation:stampIn .55s cubic-bezier(.2,1.4,.4,1) forwards;
    background:repeating-radial-gradient(circle, transparent 0 2px, rgba(140,69,54,.08) 2px 3px);
  }
  @keyframes stampIn{ to{ transform:scale(1) rotate(-9deg); opacity:.92; } }

  .likert-row{ display:flex; gap:5px; margin:8px 0 4px; }
  .likert-btn{
    flex:1; padding:8px 0; text-align:center; border:1.5px solid var(--line);
    font-family:'Courier Prime',monospace; font-size:12px; cursor:pointer; background:#f1e9d160;
  }
  .likert-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .likert-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-bottom:16px; }

  table.history{ width:100%; border-collapse:collapse; font-size:12px; font-family:'Courier Prime',monospace; }
  table.history th, table.history td{ border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; }
  table.history th{ color:var(--ink-soft); font-weight:400; font-size:10px; }
  .totals{ margin-top:16px; font-family:'Courier Prime',monospace; font-size:13.5px; line-height:2; }
  .totals b{ font-size:16px; }

  .footnote{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:20px; line-height:1.7; }
  .err{ color:var(--clay-deep); font-size:13px; margin-bottom:12px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/*
  內部備註（不對玩家顯示，僅實驗者知悉）：
  遊戲共 10 回合，內部分為第 1 階段（round 1-5）與第 2 階段（round 6-10）。
  兩位玩家的角色（分配者／接受者）在第 1 階段固定，進入第 2 階段後自動互換，
  玩家事前完全不會被告知有兩個階段、也不會被告知角色會互換。
  介面上一律只顯示「第 N 回合」，不顯示總回合數與階段資訊，
  首頁與所有玩家可見畫面也不使用「獨裁者遊戲」等會透露實驗典範的名稱。
*/
const ROOMS_COLLECTION = 'rooms';
const TOTAL_ROUNDS = 10;
const PHASE1_LEN = TOTAL_ROUNDS / 2;
const DECISION_SECONDS = 20;   // 分配者可用的決策時間（秒），要改長短只要改這個數字
const REVEAL_VIEW_SECONDS = 10;
const DEFAULT_TOTAL = 1000;
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

/* ---- 反應評估問卷（接受者，每回合結束後填寫） ---- */
const REACTION_QUESTIONS = [
  { key:'valence',      text:'請問您的情緒狀態(valence)為何?',         min:1, max:9, left:'負向',   right:'正向' },
  { key:'arousal',      text:'請問您的情緒強度(arousal)為何?',         min:1, max:9, left:'昏沉',   right:'警醒' },
  { key:'control',      text:'請問您可以控制此情緒的程度為何?',        min:1, max:9, left:'無法控制', right:'完全控制' },
  { key:'trust',        text:'請問您對隔壁參與者的信任程度為何?',      min:1, max:9, left:'不信任', right:'信任' },
  { key:'hostility',    text:'請問您對隔壁參與者的敵意程度為何?',      min:1, max:9, left:'低',     right:'高' },
  { key:'anger',        text:'請問您對隔壁參與者的生氣程度為何?',      min:1, max:9, left:'不會生氣', right:'非常生氣' },
  { key:'satisfaction', text:'請問您對隔壁參與者分配的比例滿意程度為何?', min:1, max:9, left:'滿意', right:'不滿意' },
  { key:'fairness',     text:'請問您認為此分配比例的公平程度為何?',     min:1, max:9, left:'非常公平', right:'不公平' },
];
const PHASE1_EXTRA_QUESTION = {
  key:'suggestedShare', text:'請問您認為隔壁參與者應該分出多少比例(給您)較合適?', min:0, max:10, left:'0', right:'10'
};
const REACTION_KEYS = ['valence','arousal','control','trust','hostility','anger','satisfaction','fairness','suggestedShare'];

/* ---- 人口學變項（加入房間後、任務開始前填寫） ---- */
const GENDER_OPTIONS = ['男','女','其他','不願透露'];
const OCCUPATION_OPTIONS = ['學生','軍公教','服務業','工業/製造業','商業/金融業','資訊業','自由業/自營','家管','待業中','其他'];
const EDUCATION_OPTIONS = ['國中以下','高中/高職','專科','大學','碩士','博士'];
function buildIncomeOptions(){
  // 1萬元以下每5,000元一級；1萬元以上改以1萬元為單位增長，最高「10萬元以上」
  const opts = ['5,000元以下', '5,001–10,000元'];
  for(let lo=10000; lo<100000; lo+=10000){
    opts.push(`${(lo+1).toLocaleString()}–${(lo+10000).toLocaleString()}元`);
  }
  opts.push('100,001元以上');
  return opts;
}
const INCOME_OPTIONS = buildIncomeOptions();

/* ---- 分組設計：機器人-獨裁(9:1) 50人、機器人-公平(5:5) 50人、真人對真人 100人，共200人 ---- */
/* 不再區分「是否告知對方身分」，一律不告知對方實際身分（人類／機器人）。*/
const CONDITIONS = ['robot_dictator','robot_fair','human_human'];
const CONDITION_QUOTA = { robot_dictator:50, robot_fair:50, human_human:100 };
const CONDITION_WEIGHT = { robot_dictator:1, robot_fair:1, human_human:2 }; // 每個房間會用掉的真人名額數
const CONDITION_COUNTS_KEY = 'dictgame_condition_counts';
function conditionIsAI(c){ return c === 'robot_dictator' || c === 'robot_fair'; }
function conditionDisclosed(){ return false; } // 一律不揭露對方是真人或機器人
function conditionLabel(c){
  if(c === 'robot_dictator') return '機器人分配者－獨裁型（9:1）';
  if(c === 'robot_fair') return '機器人分配者－公平型（5:5）';
  return '真人對真人';
}
function robotFixedStep(condition){
  if(condition === 'robot_dictator') return 9;
  if(condition === 'robot_fair') return 5;
  return 5;
}
async function fetchConditionCounts(){
  const zero = {}; CONDITIONS.forEach(c => zero[c] = 0);
  try{
    const data = await metaGet('condition_counts');
    const counts = data && data.counts ? Object.assign({}, data.counts) : {};
    CONDITIONS.forEach(c => { if(!counts[c]) counts[c] = 0; });
    return counts;
  }catch(e){ return zero; }
}
async function pickBalancedCondition(){
  try{
    const counts = await fetchConditionCounts();
    // 依「目前人數 / 配額」比例，挑最落後配額的組別（比例最低者優先）
    const ratios = CONDITIONS.map(c => (counts[c] || 0) / CONDITION_QUOTA[c]);
    const minRatio = Math.min(...ratios);
    const candidates = CONDITIONS.filter((c, i) => ratios[i] === minRatio);
    const picked = candidates[Math.floor(Math.random() * candidates.length)];
    counts[picked] = (counts[picked] || 0) + CONDITION_WEIGHT[picked];
    await metaSet('condition_counts', { counts });
    return picked;
  }catch(e){
    return CONDITIONS[Math.floor(Math.random() * CONDITIONS.length)];
  }
}
async function recordConditionUsage(cond){
  try{
    const counts = await fetchConditionCounts();
    counts[cond] = (counts[cond] || 0) + CONDITION_WEIGHT[cond];
    await metaSet('condition_counts', { counts });
  }catch(e){ /* best effort */ }
}
async function resolveCondition(manualCondition){
  if(manualCondition && CONDITIONS.includes(manualCondition)){
    await recordConditionUsage(manualCondition);
    return manualCondition;
  }
  return await pickBalancedCondition();
}

/* ---- 真人分配紀錄（被動蒐集，供未來分析參考；機器人行為固定為 9:1／5:5） ---- */
async function recordHumanStep(step){
  try{
    const data = await metaGet('human_pool');
    let arr = (data && data.steps) ? data.steps : [];
    arr = arr.concat([step]);
    if(arr.length > 1000) arr = arr.slice(arr.length - 1000);
    await metaSet('human_pool', { steps: arr });
  }catch(e){ /* best effort */ }
}

/* ---- 參與者編號：每位真人參與者加入房間時取得一個全域遞增編號 ---- */
async function getNextParticipantNumber(){
  try{
    const data = await metaGet('participant_counter');
    let n = (data && isFinite(data.n)) ? data.n : 0;
    n += 1;
    await metaSet('participant_counter', { n });
    return n;
  }catch(e){
    return Math.floor(Date.now() % 100000);
  }
}
function formatParticipantId(n){ return 'P' + String(n).padStart(4,'0'); }
function getReactionQuestions(round){
  const qs = REACTION_QUESTIONS.slice();
  if(round <= PHASE1_LEN) qs.push(PHASE1_EXTRA_QUESTION);
  return qs;
}

/* ---- 台灣版人際反應性指標量表 T-IRI（實驗全部結束後，雙方皆需填寫） ---- */
const IRI_ITEMS = [
  '我時常想像著一些有機會發生在我身上的事情。',
  '有時候我發現由其他人的觀點來看事情是一件困難的事。',

const BACKEND_URL_KEY = 'dictgame_backend_url';
const DEFAULT_BACKEND_URL = 'https://script.google.com/macros/s/AKfycby1J13Zu5VfdpI-k34CkLzLU-oPYQuJc3GVA4n-FqAX2VZEwxPFI6oc6Bqt8y4lbPVwaQ/exec'; // 已內建後端網址：所有裝置一律連到同一個後端；要換後端請改這一行
function backendTag(){ const u = getBackendUrl(); return u ? '…' + u.replace(/\/exec$/,'').slice(-8) : '尚未設定'; }
function getBackendUrl(){
  if(DEFAULT_BACKEND_URL) return DEFAULT_BACKEND_URL;   // 內建網址優先，避免兩台裝置各自存了不同的舊網址
  let v = '';
  try{ v = (localStorage.getItem(BACKEND_URL_KEY) || '').trim(); }catch(e){}
  return v;
}
function setBackendUrl(url){

}

function errText(e){
  if(e && e.code) return `${e.code}${e.message ? '：'+e.message : ''}`;
  if(e && e.message) return e.message;
  return '未知錯誤';
}

/* content-type 刻意用 text/plain，避免瀏覽器送出 CORS 預檢（Apps Script 不處理 OPTIONS） */
async function apiCall(action, body){
  const url = getBackendUrl();
  if(!url){
    const err = new Error('尚未設定後端網址，請先到「設定」貼上 Google Apps Script 部署網址。');
    err.code = 'backend_not_configured';
    throw err;
  }
  const payload = JSON.stringify(Object.assign({ action }, body || {}));
  let lastErr = null;
  for(let attempt = 0; attempt < 2; attempt++){      // 失敗或逾時會自動再試一次
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 25000) : null;   // 25 秒沒回應就放棄，不會一直轉圈
    try{
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: payload,
        signal: ctrl ? ctrl.signal : undefined
      });
      if(timer) clearTimeout(timer);
      let json;
      try{ json = await res.json(); }
      catch(parseErr){
        const err = new Error('後端回應格式不正確，請確認 Apps Script 已部署成功、網址是以 /exec 結尾。');
        err.code = 'bad_response';
        throw err;
      }
      if(!json || json.ok !== true){
        const err = new Error((json && json.error) ? json.error : '後端回傳失敗');
        err.code = 'backend_error';
        throw err;
      }
      return json.data;
    }catch(e){
      if(timer) clearTimeout(timer);
      if(e && (e.code === 'bad_response' || e.code === 'backend_error')) throw e;  // 後端明確回覆的錯誤不重試
      const aborted = e && e.name === 'AbortError';
      const err = new Error((aborted ? '等待後端回應逾時（超過 25 秒）' : '連不到後端伺服器（' + ((e && e.message) || 'Failed to fetch') + '）') +
        '。常見原因：①網路不穩 ②部署時「誰可以存取」不是「所有人」 ③貼的不是以 /exec 結尾的網址 ④修改程式後沒有「新版本」重新部署 ⑤這個網路擋掉了 script.google.com。');
      err.code = aborted ? 'timeout' : 'network_error';
      lastErr = err;
    }
  }
  throw lastErr;
}

async function metaGet(key){
  try{ return await apiCall('meta_get', { key }); }
  catch(e){ return null; }
}
async function metaSet(key, data){ return await apiCall('meta_set', { key, data }); }

async function storageGetStrict(code){ return await apiCall('room_get', { code }); }
async function storageGet(code){
  try{ return await apiCall('room_get', { code }); }
  catch(e){ return null; }
}
async function storageSet(code, obj){
  obj.updatedAt = Date.now();
  const out = Object.assign({}, obj, { rev: (obj.rev || 0) + 1 });
  await apiCall('room_set', { code, data: out });
  obj.rev = out.rev;     // 寫入成功後才更新本機版本號
  return obj;
}

/* 在房間上只改指定欄位（伺服器端合併），不會蓋掉另一台裝置同時寫入的其他欄位 */
function setPathLocal(obj, path, value){
  let cur = obj;
  for(let i = 0; i < path.length - 1; i++){
    const k = path[i];
    if(cur[k] === undefined || cur[k] === null || typeof cur[k] !== 'object') cur[k] = {};
    cur = cur[k];
  }
  cur[path[path.length - 1]] = value;
}
const LOG_ACTION = { Allocations: 'log_allocation', Demographics: 'log_demographics', Empathy: 'log_empathy' };
async function mergeRoom(patches, log){
  let room = null;
  try{
    const data = await apiCall('room_merge', { code: local.roomCode, patches, log });
    room = data && data.room ? data.room : null;
  }catch(e){
    if(!(e && e.code === 'backend_error' && /unknown_action/.test(e.message || ''))) throw e;
    // 後端還是舊版：退回「讀取→修改→整份寫回」
    const latest = await storageGetStrict(local.roomCode);
    if(!latest) throw new Error('找不到房間資料，房間可能已被刪除。');
    patches.forEach(p => setPathLocal(latest, p.path, p.value));
    await storageSet(local.roomCode, latest);
    if(log && LOG_ACTION[log.sheet]){ try{ await apiCall(LOG_ACTION[log.sheet], { row: log.row }); }catch(e2){} }
    room = latest;
  }
  if(!room) room = await storageGetStrict(local.roomCode);   // 舊版 room_merge 沒回傳房間時，重新讀一次
  if(room) local.roomState = room;
  return room;
}
async function storageDelete(code){ return await apiCall('room_delete', { code }); }
async function storageListRoomCodes(){
  const data = await apiCall('rooms_list', {});
  return data || [];
}

function stopPolling(){ if(local.pollTimer){ clearInterval(local.pollTimer); local.pollTimer=null; } }
function startPolling(){ stopPolling(); local.pollTimer = setInterval(pollRoom, 2500); }

async function pollRoom(){
  if(!local.roomCode) return;
  const room = await storageGet(local.roomCode);
  if(!room) return;
  const prev = local.roomState;
  // 這份資料比本機已知的還舊（例如輪詢請求在我們剛寫入之前發出）→ 直接丟掉，避免畫面倒退
  if(prev && (room.rev || 0) < (prev.rev || 0)) return;
  const changed = JSON.stringify(room) !== JSON.stringify(prev);
  const sameGameView = !!prev && local.screen === 'game' &&
    room.status === prev.status && room.round === prev.round && room.roundStatus === prev.roundStatus &&
    !!room.startedAt === !!prev.startedAt;
  local.roomState = room;

  if(local.myRole==='A' || local.myRole==='B'){
    if(room.status==='in_progress' && local.screen==='waiting') local.screen='game';
    if(room.status==='finished' && local.screen!=='survey' && local.screen!=='empathyScale' && local.screen!=='summary'){
      local.screen = decidePostFinishScreen(room, local.myRole);
      stopPolling();
    }
  }
  if(local.myRole==='experimenter' && room.status==='finished') stopPolling();

  if(changed && !sameGameView) render();
}

function showError(msg){ local.errMsg = msg; local.screen = 'error'; render(); }

function resetToHome(){
  stopPolling();
  local.screen='home'; local.myRole=null; local.roomCode=null; local.roomState=null;
  local.splitStep=null; local.splitMoved=false; local.coins=null; local._decStart=null; local.errMsg=''; local._surveyAnswers=null; local._empathyAnswers=null;
  local._demographics=null; local._demographicsNext=null;
  local._turingChoice=null; local._turingReason=''; local._myParticipantId=null;
  render();
}

async function doCreateRoom(total, manualCondition){
  if(local.busy) return;
  local.busy = true;
  const code = generateCode();
  const finalTotal = (isFinite(total) && total>0) ? total : DEFAULT_TOTAL;
  const condition = await resolveCondition(manualCondition);
  const isAI = conditionIsAI(condition);
  const disclosed = conditionDisclosed(condition);
  const aiRole = isAI ? 'B' : null; // 機器人固定扮演玩家B，玩家A固定留給建立房間的裝置
  const room = {
    code, tokenType:'real', total: finalTotal,
    condition, isAI, disclosed, aiRole,
    playerAJoined: false, playerBJoined: aiRole==='B',
    phase1Dictator:null,
    status:'waiting', round:1, roundStatus:'deciding',
    decidingStartedAt:Date.now(), revealStartedAt:null,
    pendingDecision:null, history:[],
    empathyDone:{A:false,B:false}, empathyAnswers:{}
  };
  try{
    // 建立房間的裝置直接成為玩家一（A），不用另外輸入代碼加入
    room.playerAJoined = true;
    if(room.playerAJoined && room.playerBJoined){
      room.status = 'in_progress';
      room.phase1Dictator = room.isAI ? room.aiRole : (Math.random() < 0.5 ? 'A' : 'B');
    }
    room.participantId = room.participantId || {};
    room.participantId['A'] = await getNextParticipantNumber();
    await storageSet(code, room);
    local.myRole = 'A'; local.roomCode = code; local.roomState = room;
    local._myParticipantId = formatParticipantId(room.participantId['A']);
    local._demographicsNext = room.status==='in_progress' ? 'game' : 'waiting';
    local.screen = 'demographics';
    local.busy=false;
    startPolling();
    render();
  }catch(e){ local.busy=false; showError('建立房間失敗：' + errText(e)); }
}

/* 只刪除單一房間（不影響其他房間），並把它占用的組別配額歸還 */
async function clearOneRoom(code){
  const sure = confirm(`確定要刪除房間 ${code} 的所有資料嗎？此動作無法復原。`);
  if(!sure) return;
  try{
    const room = await storageGet(code);
    if(!room){ alert('找不到這個房間，可能已經被刪除過了。'); return; }
    await storageDelete(code);
    if(room.condition){
      try{
        const counts = await fetchConditionCounts();
        const weight = CONDITION_WEIGHT[room.condition] || 0;
        counts[room.condition] = Math.max(0, (counts[room.condition]||0) - weight);
        await metaSet('condition_counts', { counts });
      }catch(e){ /* 配額歸還失敗不影響房間已刪除的結果 */ }
    }
    alert(`房間 ${code} 已刪除，該房間占用的組別配額也已歸還。\n（Google試算表裡已自動記錄的分配／問卷列不會被刪，需要的話請到試算表手動刪除。）`);
    resetToHome();
  }catch(e){
    alert('刪除失敗：' + errText(e));
  }
}

async function submitDecision(auto){
  if(local.busy) return;
  const room0 = local.roomState;
  if(!room0 || room0.roundStatus !== 'deciding') return;
  if(room0.history.some(h => h.round === room0.round)) return;   // 這回合已經送出過，避免重複送出
  local.busy = true;
  const step = (local.splitStep===null || local.splitStep===undefined) ? 5 : local.splitStep; // 自己留幾枚（0-10）
  const keep = Math.round(room0.total * step / 10);
  const give = room0.total - keep;                        // 一律分完，其餘全給對方
  const isAuto = (auto === true);
  const entry = { round: room0.round, dictator: local.myRole, keep, give, moved: !!local.splitMoved, auto: isAuto };
  const idx = room0.history.length;
  try{
    await mergeRoom([
      { path: ['pendingDecision'], value: { keep, give } },
      { path: ['roundStatus'], value: 'revealed' },
      { path: ['revealStartedAt'], value: Date.now() },
      { path: ['history', idx], value: entry }
    ]);
    local.busy = false;
    local.splitStep = null; local.splitMoved = false;
    recordHumanStep(step);
    showStamp(isAuto ? '時間到，已送出' : '分配已定案', () => render());
  }catch(e){ local.busy=false; showError('送出失敗：' + errText(e)); }
}

/* 機器人扮演分配者時，由目前唯一在線的真人裝置代為執行決策與寫入；
   分配比例固定依房間組別而定：機器人-獨裁型固定 9:1，機器人-公平型固定 5:5 */
async function aiSubmitDecision(){
  if(local.busy) return;
  const room0 = local.roomState;
  if(!room0 || room0.roundStatus !== 'deciding') return;
  if(room0.history.some(h => h.round === room0.round)) return;
  local.busy = true;
  const step = robotFixedStep(room0.condition);
  const keep = Math.round(room0.total * step / 10);
  const give = room0.total - keep;
  const idx = room0.history.length;
  try{
    await mergeRoom([
      { path: ['pendingDecision'], value: { keep, give } },
      { path: ['roundStatus'], value: 'revealed' },
      { path: ['revealStartedAt'], value: Date.now() },
      { path: ['history', idx], value: { round: room0.round, dictator: room0.aiRole, keep, give } }
    ]);
    local.busy = false;
    render();
  }catch(e){ local.busy=false; }
}

async function continueRound(extraPatches, log){
  if(local.busy) return;
  const room0 = local.roomState;
  if(!room0) return;
  local.busy = true;
  const next = room0.round + 1;
  const patches = Array.isArray(extraPatches) ? extraPatches.slice() : [];
  if(next > TOTAL_ROUNDS){
    patches.push({ path: ['status'], value: 'finished' });
  } else {
    patches.push(
      { path: ['round'], value: next },
      { path: ['roundStatus'], value: 'deciding' },
      { path: ['pendingDecision'], value: null },
      { path: ['decidingStartedAt'], value: Date.now() },
      { path: ['revealStartedAt'], value: null }
    );
  }
  try{
    const room = await mergeRoom(patches, log || undefined);
    local.busy = false;
    local._surveyAnswers = null;
    if(room.status==='finished'){
      local.screen = decidePostFinishScreen(room, local.myRole);
      stopPolling();
    } else {
      local.screen = 'game';
    }
    render();
  }catch(e){ local.busy=false; showError('操作失敗：' + errText(e)); }
}

async function submitSurvey(){
  if(local.busy) return;
  const room = local.roomState;
  const questions = getReactionQuestions(room.round);
  const allAnswered = questions.every(q => local._surveyAnswers && local._surveyAnswers[q.key] !== undefined);
  if(!allAnswered) return;
  const idx = room.history.length - 1;
  const survey = Object.assign({}, local._surveyAnswers);
  const row = buildAllocationRow(room, Object.assign({}, room.history[idx], { survey }));
  // 問卷結果 + 進入下一回合 + 寫入試算表，合併成一次連線
  await continueRound([{ path: ['history', idx, 'survey'], value: survey }], { sheet: 'Allocations', row });
}

async function submitDemographics(){
  if(local.busy) return;
  const d = local._demographics || {};
  if(!d.gender || !d.gender.trim() || !d.age || !d.age.trim() || !d.occupation || !d.income || !d.education) return;
  local.busy = true;
  try{
    const base = local.roomState;
    if(!base){ throw new Error('找不到房間資料，房間可能已被刪除或代碼有誤，請重新整理頁面。'); }
    const demo = { gender: d.gender.trim(), age: d.age.trim(), occupation: d.occupation, income: d.income, education: d.education };
    const tmp = JSON.parse(JSON.stringify(base));
    tmp.demographics = tmp.demographics || {}; tmp.demographics[local.myRole] = demo;
    const row = buildDemographicsRow(tmp, local.myRole);
    const room = await mergeRoom([{ path: ['demographics', local.myRole], value: demo }], { sheet: 'Demographics', row });
    local.busy = false;
    local.screen = local._demographicsNext || (room.status==='in_progress' ? 'game' : 'waiting');
    render();
  }catch(e){ local.busy=false; showError('資料送出失敗：' + errText(e)); }
}

async function submitEmpathyScale(){
  if(local.busy) return;
  if(!local._empathyAnswers || Object.keys(local._empathyAnswers).length < IRI_ITEMS.length) return;
  if(!local._turingChoice || !local._turingReason || !local._turingReason.trim()) return;
  const room = local.roomState;
  if(!room){ alert('找不到房間資料，請重新整理頁面。'); return; }
  local.busy = true;
  showBusyOverlay('正在送出問卷，請稍候，不要關閉或重新整理頁面…');
  const role = local.myRole;
  const answers = Object.assign({}, local._empathyAnswers);
  const turing = { guess: local._turingChoice, reason: local._turingReason.trim() };
  // 先套用到本機資料，用來組出要寫進試算表的那一列
  room.empathyAnswers = room.empathyAnswers || {};  room.empathyAnswers[role] = answers;
  room.empathyDone = room.empathyDone || {A:false,B:false};  room.empathyDone[role] = true;
  room.turingAnswers = room.turingAnswers || {};  room.turingAnswers[role] = turing;
  const row = buildEmpathyRow(room, role);
  try{
    try{
      // 一次連線完成：更新房間 + 寫入試算表（在伺服器端合併，兩人同時送出也不會互相覆蓋）
      await apiCall('room_merge', {
        code: local.roomCode,
        patches: [
          { path: ['empathyAnswers', role], value: answers },
          { path: ['empathyDone', role], value: true },
          { path: ['turingAnswers', role], value: turing }
        ],
        log: { sheet: 'Empathy', row }
      });
    }catch(e){
      // 後端還是舊版（沒有 room_merge）時，退回舊的作法
      if(e && e.code === 'backend_error' && /unknown_action/.test(e.message || '')){
        let latest = await storageGet(local.roomCode);
        if(!latest) latest = room;
        latest.empathyAnswers = latest.empathyAnswers || {};  latest.empathyAnswers[role] = answers;
        latest.empathyDone = latest.empathyDone || {A:false,B:false};  latest.empathyDone[role] = true;
        latest.turingAnswers = latest.turingAnswers || {};  latest.turingAnswers[role] = turing;
        await storageSet(local.roomCode, latest);
        logEmpathyRow(row);
      } else { throw e; }
    }
    hideBusyOverlay();
    local.busy = false;
    local.screen = 'summary';
    render();
  }catch(e){
    hideBusyOverlay();
    local.busy = false;
    alert('送出失敗：' + errText(e) + '\n\n你的作答還保留在畫面上，確認網路後請再按一次「送出問卷」。');
    renderEmpathyScale();
  }
}

/* ---------- CSV export ---------- */

function buildCSV(room){
  const pid = room.participantId || {};
  const pidOf = (role) => (role===room.aiRole ? 'robot' : (pid[role] ? formatParticipantId(pid[role]) : ''));
  const header = 'round,dictator,dictator_participant_id,recipient,recipient_participant_id,keep,give,token_type,total,' + REACTION_KEYS.join(',') + ',moved,auto_submitted\n';
  const lines = room.history.map(h => {
    const recipient = h.dictator === 'A' ? 'B' : 'A';
    const s = h.survey || {};
    const vals = REACTION_KEYS.map(k => (s[k] !== undefined ? s[k] : ''));
    return `${h.round},${h.dictator},${pidOf(h.dictator)},${recipient},${pidOf(recipient)},${h.keep},${h.give},${room.tokenType},${room.total},${vals.join(',')},${h.moved===undefined?'':(h.moved?1:0)},${h.auto===undefined?'':(h.auto?1:0)}`;
  }).join('\n');
  return header + lines + '\n';
}

function buildEmpathyCSV(room){
  const header = 'participant_id,player,' + IRI_ITEMS.map((_,i)=>`item${i+1}`).join(',') + ',turing_guess,turing_reason\n';
  const ea = room.empathyAnswers || {};
  const ta = room.turingAnswers || {};
  const pid = room.participantId || {};
  const lines = ['A','B'].filter(p => ea[p]).map(p => {
    const vals = IRI_ITEMS.map((_,i)=> (ea[p][i+1] !== undefined ? ea[p][i+1] : ''));
    const t = ta[p] || {};
    const reason = (t.reason || '').replace(/"/g, '""');
    return `${pid[p] ? formatParticipantId(pid[p]) : ''},player${p},${vals.join(',')},${t.guess || ''},"${reason}"`;
  }).join('\n');
  return header + lines + '\n';
}

function buildDemographicsCSV(room){
  const header = 'participant_id,player,gender,age,occupation,income,education,condition,partner_actual,disclosed\n';
  const dm = room.demographics || {};
  const pid = room.participantId || {};
  const lines = ['A','B'].filter(p => dm[p]).map(p => {
    const d = dm[p];
    const partnerActual = room.isAI ? 'robot' : 'human';
    return `${pid[p] ? formatParticipantId(pid[p]) : ''},player${p},${d.gender},${d.age},${d.occupation},"${d.income}",${d.education},${room.condition},${partnerActual},${room.disclosed}`;
  }).join('\n');
  return header + lines + '\n';
}

/* ---- 組成單筆紀錄，自動寫入 Google試算表（欄位需對應 Code.gs 的 HEADERS） ---- */
function buildAllocationRow(room, h){
  const pid = room.participantId || {};
  const pidOf = (role) => (role===room.aiRole ? 'robot' : (pid[role] ? formatParticipantId(pid[role]) : ''));
  const recipient = h.dictator === 'A' ? 'B' : 'A';
  const sv = h.survey || {};
  const row = {
    room_code: room.code, round: h.round, dictator: h.dictator,
    dictator_participant_id: pidOf(h.dictator), recipient,
    recipient_participant_id: pidOf(recipient), keep: h.keep, give: h.give,
    token_type: room.tokenType, total: room.total
  };
  REACTION_KEYS.forEach(k => { row[k] = (sv[k] !== undefined ? sv[k] : ''); });
  row.moved = (h.moved === undefined ? '' : (h.moved ? 1 : 0));
  row.auto_submitted = (h.auto === undefined ? '' : (h.auto ? 1 : 0));
  return row;
}
function buildDemographicsRow(room, role){
  const pid = room.participantId || {};
  const d = (room.demographics || {})[role] || {};
  return {
    participant_id: pid[role] ? formatParticipantId(pid[role]) : '',
    room_code: room.code, player: 'player' + role,
    gender: d.gender, age: d.age, occupation: d.occupation, income: d.income, education: d.education,
    condition: room.condition, partner_actual: room.isAI ? 'robot' : 'human', disclosed: room.disclosed
  };
}
function buildEmpathyRow(room, role){
  const pid = room.participantId || {};
  const ea = (room.empathyAnswers || {})[role] || {};
  const ta = (room.turingAnswers || {})[role] || {};
  const row = {
    participant_id: pid[role] ? formatParticipantId(pid[role]) : '',
    room_code: room.code, player: 'player' + role,
    turing_guess: ta.guess || '', turing_reason: ta.reason || ''
  };
  for(let i = 1; i <= IRI_ITEMS.length; i++){ row['item'+i] = (ea[i] !== undefined ? ea[i] : ''); }
  return row;
}

function downloadBlob(text, filename){
  try{
    const blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){ alert('匯出檔案失敗，請改用「複製為文字」。'); }
}
async function copyToClipboard(text, okMsg){
  try{ await navigator.clipboard.writeText(text); alert(okMsg); }
  catch(e){ alert('複製失敗，請改用「匯出 CSV」下載檔案。'); }
}

function coinEl(cls, interactive, zone){

}
/* 分配畫面：三個區域（對方／未分配／自己），每枚硬幣 = 總額 ÷ 10 */
function coinZonesHTML(mine, other, total, interactive, showPool){
  if(showPool === undefined) showPool = true;
  const pool = 10 - mine - other;
  const unit = total / 10;
  const row = (n, cls, zone) => n>0 ? Array.from({length:n}, () => coinEl(cls + (interactive?'':' static'), interactive, zone)).join('') : '<span style="font-size:12px;color:var(--ink-soft);">（空）</span>';

      <div class="zone-label"><span>給對方</span><span><b>${other}</b> 枚 ＝ ${other*unit} 元</span></div>
      <div class="coin-row">${row(other,'', 'other')}</div>
    </div>
    ${showPool ? `<div class="coin-zone pool">
      <div class="zone-label"><span>尚未分配</span><span><b>${pool}</b> 枚</span></div>
      <div class="coin-row">${row(pool,'', 'pool')}</div>
    </div>` : ``}
    <div class="coin-zone">
      <div class="zone-label"><span>留給自己</span><span><b>${mine}</b> 枚 ＝ ${mine*unit} 元</span></div>
      <div class="coin-row">${row(mine,'', 'mine')}</div>
    </div>`;
}
/* 結果畫面：10 枚硬幣中，對方留下／你獲得／未分配 各佔幾枚 */
function amountVisualHTML(tt, amount, label, keep, total){
  const unit = total / 10;
  const mineCoins = Math.round(amount / unit);   // 你獲得
  const theirCoins = Math.round(keep / unit);    // 對方留下
  const lost = Math.max(0, 10 - mineCoins - theirCoins);
  const coins = [];
  for(let i=0;i<mineCoins;i++) coins.push(coinEl('static','',''));
  for(let i=0;i<theirCoins;i++) coins.push(coinEl('dim static','',''));
  for(let i=0;i<lost;i++) coins.push(coinEl('ghost','',''));
  return `
    <div class="coin-zone">
      <div class="zone-label"><span>10 枚硬幣（每枚 ${unit} 元）</span><span>金色＝你獲得 <b>${mineCoins}</b> 枚</span></div>
      <div class="coin-row">${coins.join('')}</div>
    </div>`;
}

/* 第 1 回合要等「所有真人都已進入遊戲畫面」才開始（機器人視為隨時就緒；
   填基本資料的時間不算），計時與機器人動作都從 startedAt 起算 */
function rolesReady(room){
  return ['A','B'].every(r => (room.isAI && r === room.aiRole) || !!(room.inGame && room.inGame[r]));
}
function roundOpen(room){ return room.round > 1 || !!room.startedAt; }
function roundStart(room){ return (room.round === 1 && room.startedAt) ? room.startedAt : room.decidingStartedAt; }

function decisionRemaining(room){
  // 分配者的倒數從「這台裝置顯示分配畫面」那一刻開始算，
  // 不受網路延遲、輪詢間隔、兩台裝置時鐘不一致的影響
  if(!local._decStart || local._decStart.round !== room.round){
    local._decStart = { round: room.round, t: Date.now() };
  }
  return Math.max(0, DECISION_SECONDS - Math.floor((Date.now() - local._decStart.t) / 1000));
}
function remainingSeconds(startedAt, totalSeconds){
  if(!startedAt) return totalSeconds;
  const elapsed = Math.floor((Date.now() - startedAt) / 1000);
  return Math.max(0, totalSeconds - elapsed);
}

function renderGame(){
  const room = local.roomState;
  if(!room){ return renderShield('讀取房間狀態中…', ''); }
  const r = room.round;
  const dRole = dictatorRoleFor(room, r);
  const isDictator = local.myRole === dRole;

  if(!roundOpen(room)){
    return renderShield('等待雙方進入遊戲畫面', '兩位參與者都進入這個畫面後，第 1 回合才會開始計時，請稍候。');
  }

  if(room.roundStatus === 'deciding'){
    if(isDictator){
      if(local.splitStep===null || local.splitStep===undefined){ local.splitStep = 5; local.splitMoved = false; }
      renderDecision(room);
    } else {
      renderWaitDecision(room, r);
    }
  } else {
    if(isDictator){
      const d = room.pendingDecision;
      const waitTitle = (room.isAI && room.disclosed) ? '已送出，機器人正在查看結果' : '已送出，等待對方查看結果';
      app.innerHTML = `
        <div class="sheet shield">
          <div class="spinner"></div>
          <h1 class="doc-title" style="font-size:20px; margin-bottom:0;">${waitTitle}</h1>
          <p>第 ${r} 回合，你留下 <b>${d.keep}</b>${tokenUnit(room.tokenType)}，給對方 <b>${d.give}</b>${tokenUnit(room.tokenType)}。</p>
        </div>
      `;
    } else {
      renderReveal(room);
    }
  }
}

function renderWaitDecision(room, r){
  const remaining = remainingSeconds(roundStart(room), DECISION_SECONDS);
  const title = (room.isAI && room.disclosed) ? '機器人正在決定分配' : '等待對方決定分配';
  app.innerHTML = `
    <div class="sheet shield">
      <div class="spinner"></div>
      <h1 class="doc-title" style="font-size:20px; margin-bottom:0;">${title}</h1>
      <p>第 ${r} 回合，這回合你是接受者。</p>
      <div class="timer-badge">剩餘 <b id="countdownNum">${remaining}</b> 秒</div>
    </div>
  `;
}

function renderDecision(room){
  const total = room.total;
  const step = local.splitStep;            // 0-10：自己留幾枚硬幣，其餘全部給對方（一律分完）
  const mine = step, other = 10 - step;
  const unit = total / 10;
  const tt = room.tokenType;
  const remaining = decisionRemaining(room);

  app.innerHTML = `
    <div class="sheet">
      <div class="doc-head">
        <span class="doc-code">FORM · RA-${String(room.round).padStart(2,'0')}</span>
        <span class="doc-code">第 ${room.round} 回合</span>
      </div>
      <h1 class="doc-title" style="font-size:22px;">你是分配者，請決定</h1>
      <p class="doc-sub">你有 <b>10 枚硬幣</b>，每枚 <b>${unit}</b> ${tokenUnit(tt)}（共 ${total} ${tokenUnit(tt)}）。請拖動下方刻度，決定留給自己幾枚、給對方幾枚。</p>
      <div class="timer-badge">請在 <b id="countdownNum">${remaining}</b> 秒內完成分配</div>

      <div id="coinArea">${coinZonesHTML(mine, other, total, false, false)}</div>

      <div class="slider-wrap">
        <input type="range" id="splitRange" min="0" max="10" step="1" value="${step}">
      </div>
      <div class="likert-labels"><span>全部給對方</span><span>對半分</span><span>全部留給自己</span></div>

      <button id="stampBtn" ${local.busy?'disabled':''}>蓋章確認分配</button>
    </div>
  `;
  const rangeEl = document.querySelector('#splitRange');
  const onSlide = () => {
    local.splitStep = parseInt(rangeEl.value,10);
    local.splitMoved = true;
    const area = document.querySelector('#coinArea');
    if(area) area.innerHTML = coinZonesHTML(local.splitStep, 10 - local.splitStep, total, false, false);
  };
  rangeEl.oninput = onSlide;
  rangeEl.onchange = onSlide;
  document.querySelector('#stampBtn').onclick = () => submitDecision(false);
}

  if(!room){ return renderShield('讀取房間狀態中…', ''); }
  const tt = room.tokenType;
  const humanRoles = room.isAI ? [room.aiRole==='A' ? 'B' : 'A'] : ['A','B'];
  const humanJoinedCount = humanRoles.filter(r => (r==='A'?room.playerAJoined:room.playerBJoined)).length;
  let statusText = '';
  if(room.status==='waiting') statusText = room.isAI ? `等待真人玩家加入（${humanJoinedCount}/1）` : `等待玩家加入（${humanJoinedCount}/2）`;
  else if(room.status==='in_progress') statusText = `進行中 · 第 ${room.round} 回合`;
  else statusText = `分配階段已完成，共 ${TOTAL_ROUNDS} 回合`;

  let aKeep=0, aGive=0, bKeep=0, bGive=0;
  const rows = room.history.map(h => {
    if(h.dictator==='A'){ aKeep+=h.keep; bGive+=h.give; } else { bKeep+=h.keep; aGive+=h.give; }
    const s = h.survey || {};
    const whoLabel = (role) => role===room.aiRole ? `${role==='A'?'玩家A':'玩家B'}(機器人)` : (role==='A'?'玩家A':'玩家B');
    return `<tr><td>${h.round}</td><td>${whoLabel(h.dictator)}</td><td>${h.keep}</td><td>${h.give}</td><td>${s.fairness??'—'}</td><td>${s.satisfaction??'—'}</td></tr>`;
  }).join('');

  const roleStatusText = (doneMap) => ['A','B'].map(r => {
    if(room.isAI && r===room.aiRole) return `玩家${r}：機器人（無需填寫）`;
    return `玩家${r}：${doneMap[r] ? '已完成' : '未完成'}`;
  }).join('　／　');

  const empathyDone = room.empathyDone || {A:false,B:false};
  const empathyStatus = roleStatusText(empathyDone);
  const dm = room.demographics || {};
  const demoStatus = roleStatusText({A:!!dm.A, B:!!dm.B});
  const partnerStatus = `${conditionLabel(room.condition)}${room.isAI ? `（機器人扮演玩家${room.aiRole}）` : ''}`;

  app.innerHTML = `
    <div class="sheet">
      <div class="doc-head">
        <span class="doc-code">FORM · RA-MON</span>
        <span class="doc-code">實驗者監看</span>
      </div>
      <span class="ribbon ${tt==='real'?'money':'chip'}">${tokenGlyph(tt)} 本局代幣：${tokenLabel(tt)}（每回合 ${room.total}${tokenUnit(tt)}）</span>
      <h1 class="doc-title" style="font-size:22px;">房間監看台</h1>
      <div class="code-display">${esc(room.code)}</div>
      <div class="status-line">${statusText}</div>

      <div class="rule-box">
        <b>互動身分條件（2×2，自動隨機分派）</b><br>${partnerStatus}
      </div>

      <div class="rule-box">
        <b>基本資料填寫狀況</b><br>${demoStatus}
      </div>
      ${(dm.A || dm.B) ? `
      <div class="btn-row">
        <button id="exportDemoBtn">匯出基本資料 CSV</button>
        <button id="copyDemoBtn" class="ghost">複製基本資料文字</button>
      </div>` : ``}

      ${room.history.length ? `
        <table class="history">
          <thead><tr><th>回合</th><th>分配者</th><th>自留</th><th>給予</th><th>公平感</th><th>滿意度</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="totals">
          玩家A：分配者自留共 <b>${aKeep}</b>${tokenUnit(tt)}，擔任接受者共獲得 <b>${aGive}</b>${tokenUnit(tt)}<br>
          玩家B：分配者自留共 <b>${bKeep}</b>${tokenUnit(tt)}，擔任接受者共獲得 <b>${bGive}</b>${tokenUnit(tt)}
        </div>
        <div class="btn-row stack">
          <button id="exportCsvBtn">匯出分配資料 CSV</button>
          <button id="copyCsvBtn" class="ghost">複製為文字</button>
        </div>
      ` : `<p class="doc-sub" style="margin-top:8px;">尚無分配紀錄。</p>`}

      ${room.status==='finished' ? `
        <div class="rule-box stack">
          <b>結束問卷（人際反應性量表）完成狀況</b><br>${empathyStatus}
        </div>
        ${(empathyDone.A || empathyDone.B) ? `
        <div class="btn-row">
          <button id="exportEmpathyBtn">匯出量表 CSV</button>
          <button id="copyEmpathyBtn" class="ghost">複製量表文字</button>
        </div>` : ``}
      ` : ``}

      <button id="deleteRoomBtn" class="ghost stack" style="color:var(--clay-deep); border-color:var(--clay-deep);">刪除此房間（僅此一間，並歸還組別配額）</button>
      <button id="expBackBtn" class="ghost stack">離開監看，返回首頁</button>
    </div>
  `;
  if(dm.A || dm.B){
    document.querySelector('#exportDemoBtn').onclick = exportDemographicsCSV;
    document.querySelector('#copyDemoBtn').onclick = copyDemographicsCSVToClipboard;
  }
  if(room.history.length){
    document.querySelector('#exportCsvBtn').onclick = exportCSV;
    document.querySelector('#copyCsvBtn').onclick = copyCSVToClipboard;
  }
  if(room.status==='finished' && (empathyDone.A || empathyDone.B)){
    document.querySelector('#exportEmpathyBtn').onclick = exportEmpathyCSV;
    document.querySelector('#copyEmpathyBtn').onclick = copyEmpathyCSVToClipboard;
  }
  document.querySelector('#deleteRoomBtn').onclick = () => clearOneRoom(room.code);
  document.querySelector('#expBackBtn').onclick = resetToHome;
}

function uiTick(){
  const room = local.roomState;
  if(room && room.isAI && room.status==='in_progress'){
    const r = room.round;
    const dRole = dictatorRoleFor(room, r);
    const aiIsDictatorNow = (dRole === room.aiRole);

    if(room.roundStatus === 'deciding' && aiIsDictatorNow && !room.pendingDecision && roundOpen(room)){
      if(local._aiThresholdRound !== room.round){
        local._aiThresholdRound = room.round;
        local._aiThreshold = 2 + Math.random() * 4; // 模擬2-6秒的「思考」時間
        local._aiActed = false;
      }
      const elapsed = (Date.now() - (roundStart(room) || Date.now())) / 1000;
      if(!local._aiActed && !local.busy && elapsed >= local._aiThreshold){
        local._aiActed = true;
        aiSubmitDecision();
      }
    }
    if(room.roundStatus === 'revealed'){
      const recipientRole = dRole==='A' ? 'B' : 'A';
      if(recipientRole === room.aiRole){
        const remaining = remainingSeconds(room.revealStartedAt, REVEAL_VIEW_SECONDS);
        if(remaining<=0 && !local.busy && !local._aiContinuing){
          local._aiContinuing = true;
          aiAutoContinue().finally(() => { local._aiContinuing = false; });
        }
      }
    }
  }

  if(local.screen !== 'game') return;
  if(!room || room.status !== 'in_progress') return;
  const r = room.round;
  const dRole = dictatorRoleFor(room, r);
  const isDictator = local.myRole === dRole;

  // 第 1 回合：每台裝置進到遊戲畫面就登記「我到了」；最後一位到齊時，才把回合正式開始
  if(r === 1 && !room.startedAt){
    if((local.myRole === 'A' || local.myRole === 'B') && !local._startingRound){
      const marked = !!(room.inGame && room.inGame[local.myRole]);
      const tmp = JSON.parse(JSON.stringify(room));
      tmp.inGame = tmp.inGame || {}; tmp.inGame[local.myRole] = true;
      const patches = [];
      if(!marked) patches.push({ path: ['inGame', local.myRole], value: true });
      if(rolesReady(tmp)) patches.push({ path: ['startedAt'], value: Date.now() });
      if(patches.length){
        local._startingRound = true;
        mergeRoom(patches)
          .then(() => render())
          .catch(() => {})
          .finally(() => { local._startingRound = false; });
      }
    }
    return;
  }
  if(!roundOpen(room)) return;

  if(room.roundStatus === 'deciding'){
    const remaining = isDictator ? decisionRemaining(room) : remainingSeconds(roundStart(room), DECISION_SECONDS);
    const el = document.querySelector('#countdownNum');
    if(el) el.textContent = remaining;
    if(isDictator && remaining<=0 && !local.busy && !local._autoSubmitting){
      local._autoSubmitting = true;
      submitDecision(true).finally(() => { local._autoSubmitting = false; });
    }
  } else if(room.roundStatus === 'revealed'){
    if(!isDictator){
      const remaining = remainingSeconds(room.revealStartedAt, REVEAL_VIEW_SECONDS);
      const el = document.querySelector('#revealCountdownNum');
      if(el) el.textContent = remaining;
      const btn = document.querySelector('#continueBtn');
      if(btn && remaining<=0) btn.disabled = false;
    }
  }
}
setInterval(uiTick, 1000);

if(!getBackendUrl()) local.screen = 'settings';
render();
</script>
